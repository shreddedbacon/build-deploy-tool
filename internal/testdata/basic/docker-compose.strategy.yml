version: '2'
services:
  basic:
    build:
      context: internal/testdata/basic/docker
      dockerfile: basic.dockerfile
    labels:
      lagoon.type: basic
      lagoon.service.strategy: recreate
    ports:
      - '8080'
  basic-single:
    build:
      context: internal/testdata/basic/docker
      dockerfile: basic.dockerfile
    labels:
      lagoon.type: basic-single
      lagoon.service.strategy: rollout
      lagoon.persistent: /app/storage
    ports:
      - '8080'
